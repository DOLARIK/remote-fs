services:

  # ── Nextcloud Database ──────────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: nextcloud_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_net

  # ── Nextcloud Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nextcloud_redis
    restart: unless-stopped
    networks:
      - app_net

  # ── Nextcloud ───────────────────────────────────────────────────────────────
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud_app
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "usermod -aG staff www-data && /entrypoint.sh apache2-foreground"
    depends_on:
      - db
      - redis
    environment:
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: divyanshu-palak-wedding.space
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAIN}
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 10G
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
      - "/Volumes/DP SSD:/mnt/ssd:ro"
    networks:
      - app_net

  # ── Immich Postgres (pgvecto-rs) ────────────────────────────────────────────
  immich-database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich_pgdata:/var/lib/postgresql/data
    networks:
      - app_net

  # ── Immich Redis (Valkey) ───────────────────────────────────────────────────
  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm
    restart: unless-stopped
    networks:
      - app_net

  # ── Immich Server ───────────────────────────────────────────────────────────
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: unless-stopped
    depends_on:
      - immich-database
      - immich-redis
    environment:
      DB_HOSTNAME: immich-database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - immich_library:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - "/Volumes/DP SSD:/mnt/ssd:ro"
    networks:
      - app_net

  # ── Immich Machine Learning ─────────────────────────────────────────────────
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    restart: unless-stopped
    volumes:
      - immich_model_cache:/cache
    networks:
      - app_net

  # ── Cloudflared (single tunnel, two public hostnames) ───────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      - nextcloud
      - immich-server
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app_net

volumes:
  db_data:
  nextcloud_html:
  nextcloud_data:
  immich_pgdata:
  immich_library:
  immich_model_cache:

networks:
  app_net:
    driver: bridge
    # Named so docker-compose.ai.yml can join it as external: true