<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search — Photo Pipeline</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

<nav class="bg-white border-b px-6 py-3 flex gap-6 text-sm font-medium">
  <a href="/" class="hover:text-indigo-600">Dashboard</a>
  <a href="/clusters" class="hover:text-indigo-600">Events</a>
  <a href="/people" class="hover:text-indigo-600">People</a>
  <a href="/photos" class="hover:text-indigo-600">Photos</a>
  <a href="/graph" class="hover:text-indigo-600">Graph</a>
  <a href="/insights" class="hover:text-indigo-600">Insights</a>
  <a href="/search" class="text-indigo-600 hover:underline">Search</a>
</nav>

<main class="max-w-3xl mx-auto p-6">
  <h1 class="text-2xl font-bold mb-6">Knowledge Graph Search</h1>

  <form method="get" action="/search" class="flex gap-2 mb-8">
    <input type="text" name="q" value="{{ query }}"
           placeholder="e.g. bride's mother during mehndi, yellow saree"
           class="flex-1 border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    <button type="submit"
            class="bg-indigo-600 text-white px-4 py-2 rounded text-sm hover:bg-indigo-700">
      Search
    </button>
  </form>

  {% if query and not results %}
    <p class="text-gray-500">No results found for "<strong>{{ query }}</strong>".</p>
  {% endif %}

  {% if results %}
  <div class="space-y-3">
    {% for r in results %}
    <div class="bg-white rounded-lg border p-4">
      <p class="text-sm">{{ r.fact }}</p>
      {% if r.valid_at %}
        <p class="text-xs text-gray-400 mt-1">{{ r.valid_at }}</p>
      {% endif %}
    </div>
    {% endfor %}
  </div>
  {% endif %}

</main>
</body>
</html>
