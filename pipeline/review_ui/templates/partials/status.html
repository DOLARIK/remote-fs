{% if running %}
  <div class="flex items-center gap-3">
    <div class="w-full bg-gray-200 rounded-full h-2">
      <div class="bg-indigo-600 h-2 rounded-full" style="width: {{ pct }}%"></div>
    </div>
    <span class="text-sm text-gray-600 whitespace-nowrap">{{ processed }}/{{ total }}</span>
  </div>
  <p class="text-xs text-yellow-600 mt-1">Running… (auto-refreshes every 5s)</p>
{% else %}
  <p class="text-gray-500">Idle — {{ processed }} photos processed, {{ failed }} failed</p>
{% endif %}
